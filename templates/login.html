<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro Olmo - Administración</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f08 50%, #0d0704 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #d4af37;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(139, 69, 19, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .theater-curtain {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, #8b0000 0%, #5c0000 100%);
            border-bottom: 3px solid #d4af37;
            z-index: 1;
        }

        .theater-curtain::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 40px,
                rgba(212, 175, 55, 0.1) 40px,
                rgba(212, 175, 55, 0.1) 45px
            );
        }

        .login-container {
            background: rgba(26, 15, 8, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 15px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(212, 175, 55, 0.2),
                inset 0 1px 0 rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .theater-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .theater-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            font-family: 'Times New Roman', serif;
        }

        .theater-subtitle {
            font-size: 0.9rem;
            color: #b8860b;
            font-style: italic;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .decorative-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 1.5rem 0;
        }

        .admin-title {
            text-align: center;
            color: #cd853f;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            font-weight: 400;
            text-align: center;
            border: 1px solid;
        }

        .alert-error {
            background: rgba(139, 0, 0, 0.2);
            color: #d4af37;
            border-color: rgba(139, 0, 0, 0.5);
        }

        .alert-success {
            background: rgba(212, 175, 55, 0.2);
            color: #2c1810;
            border-color: rgba(212, 175, 55, 0.5);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-group::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .input-group:focus-within::before {
            transform: scaleX(1);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(44, 24, 16, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #d4af37;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
            background: rgba(44, 24, 16, 0.8);
        }

        input::placeholder {
            color: rgba(212, 175, 55, 0.6);
            font-style: italic;
        }

        button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #8b0000 0%, #5c0000 100%);
            color: #d4af37;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover {
            border-color: #d4af37;
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: translateY(0);
        }

        .theater-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .theater-footer p {
            color: #8b7355;
            font-size: 0.8rem;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            
            .theater-name {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
        }

        .stage-lights {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: linear-gradient(
                to right,
                transparent,
                rgba(212, 175, 55, 0.3) 10%,
                rgba(212, 175, 55, 0.5) 50%,
                rgba(212, 175, 55, 0.3) 90%,
                transparent
            );
            border-radius: 0 0 50px 50px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="theater-curtain"></div>
    <div class="stage-lights"></div>
    
    <div class="login-container">
        <div class="theater-logo">
            <h1 class="theater-name">OLMO</h1>
            <p class="theater-subtitle">Teatro</p>
        </div>
        
        <div class="decorative-line"></div>
        
        <h2 class="admin-title">Panel de Administración</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        
        <form method="post">
            <div class="input-group">
                <input type="text" name="username" placeholder="Usuario" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit">Acceder</button>
        </form>

    </div>

    <script>
        // Efecto sutil de entrada
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.login-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.8s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
